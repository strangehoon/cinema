name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: bash ./gradlew test --no-daemon

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  compose-e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: docker compose up --build --detach --wait --wait-timeout 300
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test live.spec.ts
        working-directory: web
        env:
          LIVE_BASE_URL: http://127.0.0.1:8080
      - name: Verify bookings survive restart
        run: |
          before=$(docker compose exec -T mysql mysql -ucinema -pcinema cinema -N -e "SELECT COUNT(*) FROM booking_orders")
          test "$before" -ge 1
          docker compose down
          docker compose up --detach --wait --wait-timeout 300
          after=$(docker compose exec -T mysql mysql -ucinema -pcinema cinema -N -e "SELECT COUNT(*) FROM booking_orders")
          test "$after" = "$before"
      - if: always()
        run: docker compose logs --no-color > compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose.log
      - if: always()
        run: docker compose down --volumes

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/should-deploy-test.sh
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9
      - run: terraform fmt -check -recursive infra/aws
      - run: terraform init -backend=false
        working-directory: infra/aws
      - run: terraform validate
        working-directory: infra/aws
      - run: bash -n deploy/aws/app/deploy.sh deploy/aws/app/rollback.sh deploy/aws/ci/deploy.sh deploy/aws/install.sh infra/aws/user-data.sh
      - run: bash deploy/aws/tests/deploy_test.sh
      - name: Validate AWS Compose files
        run: |
          export MYSQL_PASSWORD=test MYSQL_ROOT_PASSWORD=test GRAFANA_ADMIN_PASSWORD=test DB_PASSWORD=test
          export API_BLUE_IMAGE=example/api:blue API_GREEN_IMAGE=example/api:green
          export WEB_BLUE_IMAGE=example/web:blue WEB_GREEN_IMAGE=example/web:green
          for file in deploy/aws/common/compose.yml deploy/aws/mysql/compose.yml deploy/aws/redis/compose.yml deploy/aws/monitoring/compose.yml; do
            docker compose -f "$file" config --quiet
          done
          docker compose -f deploy/aws/app/compose.yml --profile blue --profile green config --quiet
      - name: Check AWS web Nginx configuration
        run: docker run --rm -v "$PWD/deploy/aws/app/web.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t

  deploy-changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.detect.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$BEFORE" "$AFTER")"
          if printf '%s\n' "$changed_files" | bash .github/scripts/should-deploy.sh; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.deploy-changes.outputs.required == 'true'
    needs: [backend, frontend, compose-e2e, deployment-config, deploy-changes]
    runs-on: ubuntu-latest
    concurrency:
      group: cinema-develop-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPONAME }}:api-${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPONAME }}:web-${{ github.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-2
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
      - name: Deploy to EC2
        env:
          IMAGE_BASE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPONAME }}
        run: bash deploy/aws/ci/deploy.sh "$GITHUB_SHA" "$IMAGE_BASE" "$GITHUB_REPOSITORY"
