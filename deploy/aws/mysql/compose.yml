services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cinema
      MYSQL_USER: cinema
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command: ["--innodb-buffer-pool-size=256M", "--max-connections=80"]
    ports:
      - "3306:3306"
    volumes:
      - cinema_mysql:/var/lib/mysql
    mem_limit: 1400m
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30

  mysql-exporter:
    image: prom/mysqld-exporter:v0.17.2
    restart: unless-stopped
    command: ["--mysqld.address=mysql:3306", "--mysqld.username=cinema"]
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "9104:9104"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  cinema_mysql:
