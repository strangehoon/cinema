global:
  scrape_interval: 15s

scrape_configs:
  - job_name: cinema-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["10.20.1.10:9091"]

  - job_name: ec2
    static_configs:
      - targets:
          - "10.20.1.10:9100"
          - "10.20.1.20:9100"
          - "10.20.1.30:9100"
          - "10.20.1.40:9100"

  - job_name: mysql
    static_configs:
      - targets: ["10.20.1.20:9104"]

  - job_name: redis
    static_configs:
      - targets: ["10.20.1.30:9121"]
