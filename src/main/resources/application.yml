spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cinema?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username:
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        function_contributor: com.example.config.MySQLCustomDialect
        format_sql: true
  sql:
    init:
      mode: always
      data-locations: classpath:db/init/dummy.sql

  redis:
    host: localhost
    port: 6379

psp:
  toss:
    secret-key: dummy
    url: https://api.tosspayments.com

---

spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never

  redis:
    host: localhost
    port: 6378
