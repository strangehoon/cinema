spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cinema}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:cinema}
    password: ${DB_PASSWORD:cinema}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  sql:
    init:
      mode: never

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 500ms
      timeout: 500ms

server:
  port: ${SERVER_PORT:8081}

app:
  version: ${APP_VERSION:local}

management:
  health:
    redis:
      enabled: false
  metrics:
    tags:
      version: ${app.version:local}

psp:
  toss:
    secret-key: ${TOSS_SECRET_KEY:dummy}
    client-key: ${TOSS_CLIENT_KEY:}
    url: https://api.tosspayments.com

payment:
  mode: ${PAYMENT_MODE:mock}

---

spring:
  config:
    activate:
      on-profile: test

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  sql:
    init:
      mode: never

  flyway:
    enabled: true

  data:
    redis:
      host: localhost
      port: 6378
